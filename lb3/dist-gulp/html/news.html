<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Админ-панель Social Network">
    <title>Новости друзей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container"><a class="navbar-brand" href="/users.html"> <i class="bi bi-shield-check"></i> Admin Panel</a>
        <div class="navbar-text"><small class="text-light-opacity">Current User: Admin</small></div>
      </div>
    </nav>
    <div class="container">
      <div class="main-container">
        <div class="container mt-4">
          <div class="row">
            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Новости друзей</h1>
                <button class="btn btn-secondary col-2" id="backBtn">Назад</button>
              </div>
              <div class="row" id="newsContainer"></div>
            </div>
          </div>
        </div>
      </div>
      <template id="newsCardTemplate">
        <div class="col-12">
          <div class="card news-card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
              <div class="d-flex align-items-center">
                <div>
                  <h6 class="mb-0 news-author-name"></h6><small class="text-muted news-date"></small>
                </div>
              </div>
            </div>
            <div class="card-body">
              <p class="card-text news-content"></p>
              <div class="news-photos"></div>
            </div>
          </div>
        </div>
      </template>
    </div>
    <script src="js/news.js"></script>
  </body>
</html>
