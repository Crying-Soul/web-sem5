<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Админ-панель Social Network">
    <title>Управление пользователями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container"><a class="navbar-brand" href="/users.html"> <i class="bi bi-shield-check"></i> Admin Panel</a>
        <div class="navbar-text"><small class="text-light-opacity">Current User: Admin</small></div>
      </div>
    </nav>
    <div class="container">
      <div class="main-container">
        <div class="container">
          <div class="main-container">
            <div class="row">
              <div class="col-12">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
                  <h1 class="page-header">Управление пользователями</h1>
                  <div class="action-buttons"><a class="btn action-btn btn-success" href="http://localhost:4200/profile" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Перейти в приложение</a>
                    <button class="btn action-btn btn-primary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
                  </div>
                </div>
                <!-- Stats Overview-->
                <div class="stats-grid">
                  <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Всего пользователей</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-number" id="activeUsers">0</div>
                    <div class="stat-label">Активных</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-number" id="adminUsers">0</div>
                    <div class="stat-label">Администраторов</div>
                  </div>
                </div>
                <div class="row" id="usersContainer"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <template id="userCardTemplate">
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card user-card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h5 class="user-name mb-0"></h5><span class="badge status-badge"></span>
            </div>
            <div class="card-body">
              <div class="user-avatar mb-3 text-center">
                <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;"><i class="bi bi-person-fill text-muted" style="font-size: 2rem;"></i></div>
              </div>
              <div class="user-info">
                <div class="info-item"><i class="bi bi-envelope-fill text-primary"></i><strong>Email:</strong><span class="user-email"></span></div>
                <div class="info-item"><i class="bi bi-calendar-event-fill text-success"></i><strong>Дата рождения:</strong><span class="user-birthDate"></span></div>
                <div class="info-item"><i class="bi bi-person-badge-fill text-warning"></i><strong>Роль:</strong><span class="user-role"></span></div>
                <div class="info-item"><i class="bi bi-circle-fill text-info"></i><strong>Статус:</strong><span class="user-status"></span></div>
              </div>
            </div>
            <div class="card-footer bg-transparent border-0 pt-0">
              <div class="btn-group w-100">
                <button class="btn btn-outline-primary btn-sm user-edit-btn"><i class="bi bi-pencil-square"></i><span class="d-none d-sm-inline">Редактировать</span></button>
                <button class="btn btn-outline-info btn-sm user-friends-btn"><i class="bi bi-people-fill"></i><span class="d-none d-sm-inline">Друзья</span></button>
                <button class="btn btn-outline-secondary btn-sm user-messages-btn"><i class="bi bi-chat-left-text-fill"></i><span class="d-none d-sm-inline">Сообщения</span></button>
              </div>
            </div>
          </div>
        </div>
      </template>
      <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editUserModalLabel"> <i class="bi bi-person-gear"></i> Редактирование пользователя</h5>
              <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="editUserFirstName"> <i class="bi bi-person"></i> Имя</label>
                    <input class="form-control" id="editUserFirstName" type="text" required maxlength="25">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="editUserLastName"> <i class="bi bi-person"></i> Фамилия</label>
                    <input class="form-control" id="editUserLastName" type="text" required maxlength="25">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="editUserEmail"> <i class="bi bi-envelope"></i> Email</label>
                  <input class="form-control" id="editUserEmail" type="email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="editUserbirthDate"> <i class="bi bi-calendar"></i> Дата рождения</label>
                  <input class="form-control" id="editUserbirthDate" type="date">
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="editUserRole"> <i class="bi bi-person-badge"></i> Роль</label>
                    <select class="form-select" id="editUserRole">
                      <option value="user">Пользователь</option>
                      <option value="admin">Администратор</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="editUserStatus"> <i class="bi bi-circle-fill"></i> Статус</label>
                    <select class="form-select" id="editUserStatus">
                      <option value="unconfirmed">Не подтверждён</option>
                      <option value="active">Активный</option>
                      <option value="blocked">Заблокирован</option>
                    </select>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" type="button" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Отмена</button>
              <button class="btn btn-primary" id="saveUserChanges" type="button"><i class="bi bi-check-circle"></i> Сохранить изменения</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/users.js"></script>
  </body>
</html>
